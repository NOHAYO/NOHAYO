version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nohayo_app
      POSTGRES_PASSWORD: nohayo_dev_pw
      POSTGRES_DB: nohayo_companion
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nohayo_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://nohayo_app:nohayo_dev_pw@db:5432/nohayo_companion
      JWT_SECRET: change-me-to-a-long-random-string
      PORT: 4000
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:4000/api
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
